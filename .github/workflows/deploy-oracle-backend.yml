name: Deploy backend and pybb3 to Oracle

on:
  workflow_dispatch:

concurrency:
  group: oracle-backend-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Build ARM64 images and deploy
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out selected ref
        uses: actions/checkout@v6

      - name: Resolve image tags
        id: images
        run: |
          image_prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "backend=$image_prefix/backend:$GITHUB_SHA"
            echo "pybb3=$image_prefix/pybb3-service:$GITHUB_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Set up ARM64 emulation
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.images.outputs.backend }}
          cache-from: type=gha,scope=oracle-backend-arm64
          cache-to: type=gha,mode=max,scope=oracle-backend-arm64

      - name: Build and publish pybb3 service image
        uses: docker/build-push-action@v6
        with:
          context: ./pybb3-service
          file: ./pybb3-service/Dockerfile
          platforms: linux/arm64
          push: true
          build-args: |
            PYBB3_REF=${{ vars.PYBB3_REF || 'main' }}
          tags: ${{ steps.images.outputs.pybb3 }}
          cache-from: type=gha,scope=oracle-pybb3-arm64
          cache-to: type=gha,mode=max,scope=oracle-pybb3-arm64

      - name: Prepare deployment bundle
        env:
          BACKEND_IMAGE: ${{ steps.images.outputs.backend }}
          PYBB3_IMAGE: ${{ steps.images.outputs.pybb3 }}
        run: |
          printf 'BACKEND_IMAGE=%s\nPYBB3_IMAGE=%s\n' \
            "$BACKEND_IMAGE" "$PYBB3_IMAGE" > "$RUNNER_TEMP/deploy.env"

      - name: Configure SSH
        env:
          ORACLE_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          ORACLE_SSH_KNOWN_HOSTS: ${{ secrets.ORACLE_SSH_KNOWN_HOSTS }}
        run: |
          for name in ORACLE_SSH_PRIVATE_KEY ORACLE_SSH_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not configured"
              exit 1
            fi
          done
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$ORACLE_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/oracle_deploy_key"
          chmod 600 "$RUNNER_TEMP/oracle_deploy_key"
          printf '%s\n' "$ORACLE_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Validate Oracle deployment secrets
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          for name in ORACLE_HOST ORACLE_USER GHCR_USERNAME GHCR_READ_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not configured"
              exit 1
            fi
          done
          if [[ ! "$GHCR_USERNAME" =~ ^[A-Za-z0-9-]+$ ]]; then
            echo "::error::GHCR_USERNAME contains unsupported characters"
            exit 1
          fi

      - name: Copy Compose deployment files
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          target="$ORACLE_USER@$ORACLE_HOST"
          ssh -i "$RUNNER_TEMP/oracle_deploy_key" -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$target" \
            'mkdir -p "$HOME/cyanidebowl/deploy"'
          scp -i "$RUNNER_TEMP/oracle_deploy_key" -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            compose.oracle.yaml "$RUNNER_TEMP/deploy.env" \
            "$target:cyanidebowl/deploy/"

      - name: Deploy containers on Oracle
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          target="$ORACLE_USER@$ORACLE_HOST"
          ssh_args=(-i "$RUNNER_TEMP/oracle_deploy_key" -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")

          printf '%s' "$GHCR_READ_TOKEN" | ssh "${ssh_args[@]}" "$target" \
            "docker login ghcr.io --username '$GHCR_USERNAME' --password-stdin"

          ssh "${ssh_args[@]}" "$target" 'bash -s' <<'REMOTE'
          set -euo pipefail
          app_dir="$HOME/cyanidebowl"
          deploy_dir="$app_dir/deploy"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

          if [ ! -f "$app_dir/.env" ]; then
            echo "Missing $app_dir/.env; follow DEPLOY.md before deploying." >&2
            exit 1
          fi

          install -m 600 "$deploy_dir/deploy.env" "$app_dir/.deploy.env"
          install -m 644 "$deploy_dir/compose.oracle.yaml" "$app_dir/compose.oracle.yaml"
          cd "$app_dir"

          compose=(docker compose --env-file .env --env-file .deploy.env \
            -f compose.oracle.yaml)
          "${compose[@]}" pull backend pybb3-service
          "${compose[@]}" up -d --no-build --wait --wait-timeout 300 \
            backend pybb3-service cloudflared
          "${compose[@]}" ps
          REMOTE