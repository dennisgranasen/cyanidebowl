name: Build Oracle ARM64 images

on:
  workflow_dispatch:

concurrency:
  group: oracle-arm64-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and export ARM64 images
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out selected ref
        uses: actions/checkout@v6

      - name: Set up ARM64 emulation
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/arm64
          load: true
          tags: cyanidebowl-backend:arm64
          cache-from: type=gha,scope=oracle-backend-arm64
          cache-to: type=gha,mode=max,scope=oracle-backend-arm64

      - name: Build pybb3 service ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: ./pybb3-service
          file: ./pybb3-service/Dockerfile
          platforms: linux/arm64
          load: true
          build-args: |
            PYBB3_REF=${{ vars.PYBB3_REF || 'main' }}
          tags: cyanidebowl-pybb3-service:arm64
          cache-from: type=gha,scope=oracle-pybb3-arm64
          cache-to: type=gha,mode=max,scope=oracle-pybb3-arm64

      - name: Export images and checksum
        run: |
          docker image inspect cyanidebowl-backend:arm64 >/dev/null
          docker image inspect cyanidebowl-pybb3-service:arm64 >/dev/null
          docker save cyanidebowl-backend:arm64 cyanidebowl-pybb3-service:arm64 \
            | gzip -1 > cyanidebowl-oracle-arm64.tar.gz
          sha256sum cyanidebowl-oracle-arm64.tar.gz \
            > cyanidebowl-oracle-arm64.tar.gz.sha256

      - name: Upload Oracle image artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyanidebowl-oracle-arm64-${{ github.sha }}
          path: |
            cyanidebowl-oracle-arm64.tar.gz
            cyanidebowl-oracle-arm64.tar.gz.sha256
            compose.oracle.yaml
          if-no-files-found: error
          compression-level: 0
          retention-days: 14