name: Pull data from Cyanide and update MongoDB

on:
  workflow_dispatch:  # allows manual triggering of the workflow
  schedule:
    - cron: '0 * */15 * *'    # every 15 minutes
jobs:
  fetch_data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build with Maven
        run: mvn clean package -DskipTests -DskipDocker -P fetcher

      - name: Fetch Competitions
        run: java -jar ./backend/target/backend.jar

      # Optionally, upload logs or artifacts if needed