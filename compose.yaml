version: '3.1'

services:
  warpscores-db:
    container_name: warpscores-db
    hostname: warpscores-db
    image: 'mongo:7.0.5'
    environment:
      - 'MONGO_INITDB_DATABASE=warpscores'
      - 'MONGO_INITDB_ROOT_PASSWORD=some password'
      - 'MONGO_INITDB_ROOT_USERNAME=root'
    ports:
      - '32768:27017'
    volumes:
      - ./data:/data/db
