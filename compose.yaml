services:
  warpscores-db:
    container_name: warpscores-db
    hostname: warpscores-db
    image: 'mongo:7.0.5'
    environment:
      - 'MONGO_INITDB_DATABASE=warpscores'
      - 'MONGO_INITDB_ROOT_PASSWORD=some password'
      - 'MONGO_INITDB_ROOT_USERNAME=root'
    ports:
      - '32769:27017'
    volumes:
      - ./data:/data/db
  pybb3-service:
    build:
      context: ./pybb3-service
      args:
        PYBB3_REF: ${PYBB3_REF:-main}
    environment:
      PYBB3_INTERNAL_API_KEY: ${PYBB3_INTERNAL_API_KEY}
    ports:
      - '8000:8000'
    profiles:
      - pybb3
