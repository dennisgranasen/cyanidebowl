name: cyanidebowl

networks:
  internal_net:
    driver: bridge

volumes:
  pybb3-credentials:

services:
  pybb3-service:
    image: ${PYBB3_IMAGE:?PYBB3_IMAGE is required}
    container_name: pybb3-service
    restart: unless-stopped
    group_add:
      - ${PYBB3_DATA_GID:-20000}
    environment:
      PYBB3_INTERNAL_API_KEY: ${PYBB3_INTERNAL_API_KEY}
      PYBB3_CREDENTIAL_ENCRYPTION_KEY: ${PYBB3_CREDENTIAL_ENCRYPTION_KEY}
    volumes:
      - pybb3-credentials:/var/lib/pybb3/credentials
      - ./data/replays:/app/replays
    networks:
      - internal_net
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    container_name: cyanidebowl-backend
    restart: unless-stopped
    environment:
      SPRING_DATA_MONGODB_URI: ${SPRING_MONGODB_URI}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-server}
      SERVER_PORT: ${SERVER_PORT:-8080}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      PYBB3_SERVICE_URL: http://pybb3-service:8000
      PYBB3_INTERNAL_API_KEY: ${PYBB3_INTERNAL_API_KEY}
      CYANIDE_API_KEY: ${CYANIDE_API_KEY}
      AUTH0_URI: ${AUTH0_URI}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
      AUTH0_MGMT_CLIENT_ID: ${AUTH0_MGMT_CLIENT_ID:-}
      AUTH0_MGMT_CLIENT_SECRET: ${AUTH0_MGMT_CLIENT_SECRET:-}
      FRONTEND_URI: ${FRONTEND_URI}
      REPLAY_SWEEPER_STORAGE_DIRECTORY: /app/replays
      AI_API_KEY_GEMINI: ${AI_API_KEY_GEMINI}
      AI_API_KEY_GROQ: ${AI_API_KEY_GROQ}
      AI_API_KEY_OPENROUTER: ${AI_API_KEY_OPENROUTER}
      AI_API_KEY_OPENAI: ${AI_API_KEY_OPENAI}
      AI_API_KEY_CLOUDFLARE: ${AI_API_KEY_CLOUDFLARE}
      AI_API_KEY_AION: ${AI_API_KEY_AION}
      AI_API_KEY_MISTRAL: ${AI_API_KEY_MISTRAL}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID}
      CLOUDFLARE_IMAGE_MODEL: ${CLOUDFLARE_IMAGE_MODEL:-@cf/black-forest-labs/flux-2-klein-4b}
      CLOUDFLARE_IMAGE_TIMEOUT: ${CLOUDFLARE_IMAGE_TIMEOUT:-3m}
      CLOUDFLARE_IMAGE_STEPS: ${CLOUDFLARE_IMAGE_STEPS:-4}
      COMMUNITY_MEDIA_PROVIDER: ${COMMUNITY_MEDIA_PROVIDER:-cloudflare}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-image-2}
      OPENAI_IMAGE_TIMEOUT: ${OPENAI_IMAGE_TIMEOUT:-3m}
      COMMUNITY_MEDIA_QUALITY: ${COMMUNITY_MEDIA_QUALITY:-low}
      COMMUNITY_MEDIA_STORAGE_DIR: /data/community-media
      COMMUNITY_MEDIA_POLL_MS: ${COMMUNITY_MEDIA_POLL_MS:-30000}
      COMMUNITY_MEDIA_MAX_ATTEMPTS: ${COMMUNITY_MEDIA_MAX_ATTEMPTS:-4}
      COMMUNITY_MEDIA_RETRY_BASE_DELAY: ${COMMUNITY_MEDIA_RETRY_BASE_DELAY:-30s}
      COMMUNITY_MEDIA_RUNNING_TIMEOUT: ${COMMUNITY_MEDIA_RUNNING_TIMEOUT:-10m}
      COMMUNITY_MEDIA_QUOTA_EXHAUSTED_COOLDOWN: ${COMMUNITY_MEDIA_QUOTA_EXHAUSTED_COOLDOWN:-12h}
      FAN_RATE_LIMIT_COOLDOWN: ${FAN_RATE_LIMIT_COOLDOWN:-2m}
    volumes:
      - ./data/replays:/app/replays
      - ./data/community-media:/data/community-media
    networks:
      - internal_net
    depends_on:
      pybb3-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://127.0.0.1:8080/actuator/health
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cyanidebowl-cloudflared
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_API_TUNNEL_TOKEN:?CLOUDFLARE_API_TUNNEL_TOKEN is required}
    networks:
      - internal_net
    depends_on:
      backend:
        condition: service_healthy