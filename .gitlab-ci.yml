stages:
  - build
  - test
  - package
  - deploy

variables:
  MAVEN_OPTS: -Dmaven.repo.local=.m2/repository

cache:
  paths:
    - .m2/repository
    - target

maven-build:
  stage: build
  image: registry.hub.docker.com/library/maven:3.8-openjdk-17
  script: "mvn -Ddockerfile.skip clean compile --batch-mode"

maven-test:
  stage: test
  image: registry.hub.docker.com/library/maven:3.8-openjdk-17
  script: "mvn -Ddockerfile.skip test --fail-at-end --batch-mode"
  artifacts:
    reports:
      junit:
        - "**/target/surefire-reports/TEST-*.xml"
