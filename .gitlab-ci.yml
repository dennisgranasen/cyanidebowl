stages:
  - build
  - test
  - docker

maven-build:
  image: registry.hub.docker.com/library/maven:3.8-openjdk-17
  stage: build
  script: "mvn -Ddockerfile.skip clean package -B"

maven-test:
  image: registry.hub.docker.com/library/maven:3.8-openjdk-17
  stage: test
  script: "mvn -Ddockerfile.skip test -fae"
  artifacts:
    reports:
      junit:
        - "**/target/surefire-reports/TEST-*.xml"
