stages:
  - build
  - test
  - package
  - deploy
  - release

variables:
  MAVEN_OPTS: -Dmaven.repo.local=.m2/repository

cache:
  paths:
    - .m2/repository
    - target

maven-build:
  stage: build
  image: registry.hub.docker.com/library/maven:3.8-openjdk-17
  script: "mvn -Ddockerfile.skip clean compile --batch-mode"

maven-test:
  stage: test
  image: registry.hub.docker.com/library/maven:3.8-openjdk-17
  script: "mvn -Ddockerfile.skip test --fail-at-end --batch-mode"
  artifacts:
    reports:
      junit:
        - "**/target/surefire-reports/TEST-*.xml"
        - "**/target/junit.xml"

maven-package:
  stage: package
  only:
    - /^dev$/
  image: registry.hub.docker.com/library/maven:3.8-openjdk-17
  script: "mvn -DskipTests=true -Ddockerfile.skip install"

maven-deploy:
  stage: deploy
  only:
    - /^dev$/
  image: registry.hub.docker.com/library/maven:3.8-openjdk-17
  script: "mvn -DskipTests=true -Ddockerfile.skip deploy -s ci_settings.xml"

maven-release:
  stage: release
  only:
    - /^main$/
  image: registry.hub.docker.com/library/maven:3.8-openjdk-17
  before_script:
    # Clone the repository via HTTPS inside a new directory
    - git clone "https://${GITLAB_USERNAME}:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "${CI_COMMIT_SHA}"
    # Set the displayed user with the commits that are about to be made
    - git config --global user.email "${GIT_USER_EMAIL:-$GITLAB_USER_EMAIL}"
    - git config --global user.name "${GIT_USER_NAME:-$GITLAB_USER_NAME}"
    - cd "${CI_COMMIT_SHA}"
    - nextReleaseVersion=$(mvn -q -Dexec.executable=echo -Dexec.args='${project.version}' --non-recursive exec:exec | sed 's/-SNAPSHOT//')
  script:
    - ./updateChangelog.sh "${nextReleaseVersion}"
    - git commit -a -m "Preparing release ${nextReleaseVersion}" && git push origin
    - mvn -DskipTests=true -Ddockerfile.skip release:prepare release:perform --batch-mode -s ci_settings.xml
#    - git checkout dev
#    - git merge --no-ff ${CI_COMMIT_REF_NAME}
#    - git push origin dev



