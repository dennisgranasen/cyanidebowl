stages:
  - build
  - test
  - package
  - release
  - deploy

variables:
  MAVEN_OPTS: -Dmaven.repo.local=.m2/repository

cache:
  paths:
    - .m2/repository
    - target

maven-build:
  stage: build
  image: registry.hub.docker.com/library/maven:3.8-openjdk-17
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^release-.*/
      when: never
    - if: $CI_COMMIT_BRANCH
      when: always
  script: "mvn -Ddockerfile.skip clean compile --batch-mode"

maven-test:
  stage: test
  image: registry.hub.docker.com/library/maven:3.8-openjdk-17
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^release-/
      when: never
    - if: $CI_COMMIT_BRANCH
      when: always
  script: "mvn test --fail-at-end --batch-mode"
  artifacts:
    reports:
      junit:
        - "**/target/surefire-reports/TEST-*.xml"
        - "**/target/junit.xml"

maven-package:
  stage: package
  image: registry.hub.docker.com/library/maven:3.8-openjdk-17
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_DRIVER: overlay2
  only:
    - /^dev$/
  script: "mvn -DskipTests=true install"

maven-deploy-snapshot:
  stage: deploy
  image: registry.hub.docker.com/library/maven:3.8-openjdk-17
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_DRIVER: overlay2
  only:
    - /^dev$/
  when: manual
  before_script:
    - version=$(mvn -q -Dexec.executable=echo -Dexec.args='${project.version}' --non-recursive exec:exec
  script:
    - "mvn -DskipTests=true -Ddockerfile.skip deploy -s ci_settings.xml"
    - echo "Logging in to registry..."
    - docker login registry.gitlab.com
    - echo "Tagging docker images..."
    - for project in frontend backend discord-bot; do docker tag warpscores/warpscores-${project}:${version} registry.gitlab.com/warp-scores/warp-scores-${project}:${version}; done
    - echo "Pushing docker images..."
    - for project in frontend backend discord-bot; do docker push registry.gitlab.com/warp-scores/warp-scores-${project}:${version}; done

maven-release:
  stage: release
  image: registry.hub.docker.com/library/maven:3.8-openjdk-17
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_DRIVER: overlay2
  only:
    - /^main$/
  before_script:
    - git config --global user.email "no-reply@warp-scores.net"
    - git config --global user.name "Gitlab-Pipeline"
    - which ssh-agent || ( apt-get update -y && apt-get install openssh-client -y )
    - eval $(ssh-agent -s)
    - ssh-add <(echo "$SSH_PRIVATE_KEY")
  script:
    - git checkout -B "$CI_BUILD_REF_NAME"
    - mvn -DskipTests=true release:prepare --batch-mode --settings ci_settings.xml
    - mvn -DskipTests=true release:perform --batch-mode --settings ci_settings.xml

maven-deploy:
  stage: deploy
  image: registry.hub.docker.com/library/maven:3.8-openjdk-17
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_DRIVER: overlay2
  only:
    - /^main$/
  when: manual
  before_script:
    - version=$(mvn -q -Dexec.executable=echo -Dexec.args='${project.version}' --non-recursive exec:exec)
  script:
    - "mvn -DskipTests=true -Ddockerfile.skip deploy -s ci_settings.xml"
    - echo "Logging in to registry..."
    - docker login registry.gitlab.com
    - echo "Tagging docker images..."
    - for project in frontend backend discord-bot; do docker tag warpscores/warpscores-${project}:${version} registry.gitlab.com/warp-scores/warp-scores-${project}:${version}; done
    - echo "Pushing docker images..."
    - for project in frontend backend discord-bot; do docker push registry.gitlab.com/warp-scores/warp-scores-${project}:${version}; done
