server {
    listen 80;
    server_name localhost;
    
    # Använd Dockers inbyggda DNS-resolver
    resolver 127.0.0.11 valid=30s;
    
    # 1. Servera React-appen (Single Page App fallback)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. Slussa alla /api-anrop vidare till backend
    location /api/ {
        # Skala bort /api/ från sökvägen explicit
        rewrite ^/api/(.*)$ /$1 break;

        # Dynamisk host-variabel så att Nginx inte kraschar vid uppstart
        set $backend_host "http://cyanidebowl-backend:8080";
        
        proxy_pass $backend_host;
        
        # Viktiga headers för Auth0 och klient-IP
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
    }
}