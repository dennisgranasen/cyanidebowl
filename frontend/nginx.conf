server {
    listen 80;
    server_name localhost;

    # Dockers interna DNS-server
    resolver 127.0.0.11 valid=30s ipv6=off;

    # 1. Servera React-appen (Single Page App fallback)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. Slussa alla /api-anrop vidare till backend och skala bort /api-prefixet
    location /api/ {
        # Det avslutande snedstrecket efter 8080 skalar bort /api/ från anropet!
        proxy_pass http://cyanidebowl-backend:8080/;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
    }
}